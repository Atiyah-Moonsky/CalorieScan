<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal History - CalorieScan</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="css/dashboard.css">

</head>


<body>

<div class="dashboard-wrapper">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            🌙 <span>CalorieScan</span>
        </div>


        <nav class="sidebar-menu">

            <a href="dashboard.html"
               class="menu-item">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>


            <a href="scan.html"
               class="menu-item">

                <i class="fa-solid fa-camera"></i>

                <span>Scan Food</span>

            </a>


            <a href="meal-history.html"
               class="menu-item active">

                <i class="fa-solid fa-clock-rotate-left"></i>

                <span>Meal History</span>

            </a>


            <a href="#"
               class="menu-item">

                <i class="fa-solid fa-chart-column"></i>

                <span>Statistics</span>

            </a>


            <a href="#"
               class="menu-item">

                <i class="fa-solid fa-bullseye"></i>

                <span>Goal</span>

            </a>


            <a href="profile.html"
               class="menu-item">

                <i class="fa-solid fa-user"></i>

                <span>Profile</span>

            </a>


            <a href="#"
               class="menu-item">

                <i class="fa-solid fa-gear"></i>

                <span>Settings</span>

            </a>

        </nav>

    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <!-- ================= HEADER ================= -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Meal History 🍽️
                </h1>

                <p>
                    View all your scanned meals.
                </p>

            </div>


            <div class="date-box">

                <i class="fa-regular fa-calendar"></i>

                <span id="todayDate"></span>

            </div>

        </div>



        <!-- ================= SUMMARY ================= -->

        <section class="top-grid">


            <!-- TOTAL MEALS -->

            <div class="dashboard-card">

                <div class="card-title">

                    <h2>
                        Total Meals
                    </h2>

                    <i class="fa-solid fa-utensils"></i>

                </div>


                <div class="calorie-number">

                    <span id="totalMeals">
                        0
                    </span>

                    <small>
                        meals
                    </small>

                </div>

            </div>



            <!-- TOTAL CALORIES -->

            <div class="dashboard-card">

                <div class="card-title">

                    <h2>
                        Total Calories
                    </h2>

                    <i class="fa-solid fa-fire"></i>

                </div>


                <div class="calorie-number">

                    <span id="historyCalories">
                        0
                    </span>

                    <small>
                        kcal
                    </small>

                </div>

            </div>

        </section>



        <!-- ================= MEAL HISTORY ================= -->

        <section class="dashboard-card recent-meals">


            <div class="card-title">

                <h2>
                    🍽️ All Meals
                </h2>


                <button
                    class="view-all-btn"
                    id="clearMeals"
                    type="button"
                >
                    Clear All
                </button>

            </div>



            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Food
                            </th>

                            <th>
                                Calories
                            </th>

                            <th>
                                Protein
                            </th>

                            <th>
                                Carbs
                            </th>

                            <th>
                                Fat
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="historyTable">

                    </tbody>

                </table>

            </div>

        </section>



        <!-- ================= FOOTER ================= -->

        <footer class="dashboard-footer">

            <p>
                © 2026 CalorieScan AI
            </p>

            <p>
                Eat smart. Live healthy. 💜
            </p>

        </footer>


    </main>

</div>



<!-- ================= JAVASCRIPT ================= -->
<script src="js/userStorage.js"></script>

<script>


// ========================================
// TODAY DATE
// ========================================

const todayDate =
    document.getElementById("todayDate");


if (todayDate) {

    const today =
        new Date();


    todayDate.textContent =
        today.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );

}



// ========================================
// GET MEALS
// ========================================

// ใช้ชื่อเดียวกับ scan.js

const currentUserEmail =
    localStorage.getItem("calorieScanUserEmail") || "guest";

const mealStorageKey =
    "calorieScanMeals_" + currentUserEmail;

let meals =
    JSON.parse(
        localStorage.getItem(mealStorageKey)
    ) || [];



// ========================================
// DISPLAY MEALS
// ========================================

function displayMeals() {

    const table =
        document.getElementById(
            "historyTable"
        );


    if (!table) {
        return;
    }


    table.innerHTML = "";



    // ========================================
    // NO MEALS
    // ========================================

    if (meals.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="
                        text-align:center;
                        padding:40px;
                    "
                >

                    🍽️ No meals added yet.

                    <br><br>

                    <a
                        href="scan.html"
                        style="
                            color:#7c3aed;
                            font-weight:600;
                            text-decoration:none;
                        "
                    >
                        Scan your first meal →
                    </a>

                </td>

            </tr>

        `;

    }



    // ========================================
    // DISPLAY MEALS
    // ========================================

    meals
        .slice()
        .reverse()
        .forEach(
            function(meal, reverseIndex) {


                // Original index
                const index =
                    meals.length -
                    1 -
                    reverseIndex;


                const row =
                    document.createElement(
                        "tr"
                    );


                // Date

                let mealDate = "-";


                if (meal.date) {

                    const date =
                        new Date(
                            meal.date
                        );


                    mealDate =
                        date.toLocaleString(
                            "en-US",
                            {
                                day: "numeric",
                                month: "short",
                                year: "numeric",
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );

                }


                row.innerHTML = `

                    <td>
                        ${meal.foodName || "-"}
                    </td>


                    <td>
                        ${Number(
                            meal.calories
                        ) || 0} kcal
                    </td>


                    <td>
                        ${meal.protein || "-"}
                    </td>


                    <td>
                        ${meal.carb || "-"}
                    </td>


                    <td>
                        ${meal.fat || "-"}
                    </td>


                    <td>
                        ${mealDate}
                    </td>


                    <td>

                        <button
                            type="button"
                            onclick="deleteMeal(${index})"
                            style="
                                border:none;
                                background:#f3e8ff;
                                color:#7c3aed;
                                padding:7px 12px;
                                border-radius:8px;
                                cursor:pointer;
                            "
                        >

                            Delete

                        </button>

                    </td>

                `;


                table.appendChild(row);

            }
        );



    // ========================================
    // TOTAL MEALS
    // ========================================

    document.getElementById(
        "totalMeals"
    ).textContent =
        meals.length;



    // ========================================
    // TOTAL CALORIES
    // ========================================

    const totalCalories =
        meals.reduce(
            function(total, meal) {

                return total +
                    (
                        Number(
                            meal.calories
                        ) || 0
                    );

            },
            0
        );


    document.getElementById(
        "historyCalories"
    ).textContent =
        totalCalories;

}



// ========================================
// DELETE MEAL
// ========================================

function deleteMeal(index) {

    const confirmDelete =
        confirm(
            "Delete this meal?"
        );


    if (!confirmDelete) {
        return;
    }


    meals.splice(
        index,
        1
    );


    localStorage.setItem(
    mealStorageKey,
    JSON.stringify(meals)
   );

    displayMeals();

}



// ========================================
// CLEAR ALL
// ========================================

const clearMeals =
    document.getElementById(
        "clearMeals"
    );


if (clearMeals) {

    clearMeals.addEventListener(
        "click",
        function() {


            if (meals.length === 0) {

                alert(
                    "There are no meals to delete."
                );

                return;

            }


            const confirmDelete =
                confirm(
                    "Delete ALL meal history?"
                );


            if (!confirmDelete) {
                return;
            }


            meals = [];


            localStorage.setItem(
               mealStorageKey,
               JSON.stringify(meals)
          );


            displayMeals();


        }
    );

}



// ========================================
// START
// ========================================

displayMeals();

</script>


</body>

</html>
